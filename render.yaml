services:
  - type: web
    name: jarvis-openclaw
    runtime: docker
    plan: free
    dockerCommand: sh -c 'node openclaw.mjs gateway --allow-unconfigured --bind lan --port "$PORT"'
    healthCheckPath: /startupz
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: OPENCLAW_GATEWAY_TOKEN
        sync: false
